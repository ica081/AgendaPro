<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Empresa - AgendaPro</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div class="container" style="max-width: 500px;">
    <h2>🏢 Criar sua empresa</h2>
    <p class="text-muted">Preencha os dados abaixo para começar a usar o AgendaPro.</p>

    <div class="card">
        <div class="form-group">
            <label for="companyName">Nome da empresa</label>
            <input type="text" id="companyName" placeholder="Ex: Barbearia do João">
        </div>
        <div class="form-group">
            <label for="category">Categoria</label>
            <input type="text" id="category" placeholder="Ex: Barbearia, Salão, Clínica">
        </div>
        <div class="flex" style="flex-direction: column; gap: 8px;">
            <button class="btn btn-primary btn-block" onclick="createCompany()">➕ Criar Empresa</button>
            <button class="btn btn-outline btn-block" onclick="window.location.href='/company/dashboard-empresa.html'">⬅️ Voltar</button>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://agendaapi-4772.onrender.com";

    function getToken() {
        return localStorage.getItem("token");
    }

    async function createCompany() {
        const name = document.getElementById("companyName").value.trim();
        const category = document.getElementById("category").value.trim();

        if (!name || !category) {
            alert("Preencha nome e categoria.");
            return;
        }

        const token = getToken();
        if (!token) {
            alert("Faça login primeiro.");
            window.location.href = "/shared/login.html";
            return;
        }

        try {
            const response = await fetch(`${API_URL}/companies`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({ name, category })
            });

            if (!response.ok) {
                const errorText = await response.text();
                alert("Erro: " + response.status + " - " + errorText);
                return;
            }

            const data = await response.json();
            console.log("Resposta do backend:", data);

            if (data.token) {
                localStorage.setItem("token", data.token);
                localStorage.setItem("companyId", data.companyId);
            } else if (data.companyId) {
                localStorage.setItem("companyId", data.companyId);
            } else {
                alert("Resposta inesperada.");
                return;
            }

            alert("Empresa criada com sucesso!");
            window.location.href = "/company/dashboard-empresa.html";
        } catch (error) {
            console.error(error);
            alert("Erro de conexão.");
        }
    }
</script>

<script src="/js/theme.js"></script>
</body>
</html>
