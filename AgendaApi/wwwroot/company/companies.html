<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Criar Empresa</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 500px; margin: 0 auto; }
        input, button { display: block; width: 100%; margin-bottom: 10px; padding: 8px; }
        button { background: #4CAF50; color: white; border: none; cursor: pointer; }
        button:hover { background: #45a049; }
    </style>
</head>
<body>
    <h2>Criar sua empresa</h2>
    <input type="text" id="companyName" placeholder="Nome da empresa">
    <input type="text" id="category" placeholder="Categoria">
    <button onclick="createCompany()">Criar Empresa</button>
    <button onclick="window.location.href='/company/dashboard-empresa.html'" style="background:#999;">Voltar</button>

    <script>
        const API_URL = "http://localhost:5182";

        function getToken() {
            return localStorage.getItem("token");
        }

        async function createCompany() {
            const name = document.getElementById("companyName").value.trim();
            const category = document.getElementById("category").value.trim();

            if (!name || !category) {
                alert("Preencha nome e categoria.");
                return;
            }

            const token = getToken();
            if (!token) {
                alert("Faça login primeiro.");
                window.location.href = "/shared/login.html";
                return;
            }

            try {
                const response = await fetch(`${API_URL}/companies`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({ name, category })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    alert("Erro: " + response.status + " - " + errorText);
                    return;
                }

                const data = await response.json();
                console.log("Resposta do backend:", data);

                if (data.token) {
                    localStorage.setItem("token", data.token);
                    localStorage.setItem("companyId", data.companyId);
                } else if (data.companyId) {
                    localStorage.setItem("companyId", data.companyId);
                } else {
                    alert("Resposta inesperada.");
                    return;
                }

                alert("Empresa criada com sucesso!");
                window.location.href = "/company/dashboard-empresa.html";
            } catch (error) {
                console.error(error);
                alert("Erro de conexão.");
            }
        }
    </script>
</body>
</html>
