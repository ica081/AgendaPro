<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Empresa</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        button { padding: 8px 16px; margin: 4px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #45a049; }
        .btn-danger { background: #f44336; }
        .btn-danger:hover { background: #d32f2f; }
        .btn-outline { background: transparent; color: #333; border: 1px solid #ccc; }
        .btn-outline:hover { background: #f0f0f0; }
        .link-box { background: #f0f4ff; padding: 16px; border-radius: 8px; border: 1px solid #b3d4fc; margin: 20px 0; }
        .link-box input { width: 70%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .link-box button { padding: 8px 16px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .link-box button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <h2>Dashboard - Empresa</h2>
    <div id="companySelector" style="margin-bottom:15px;"></div>

    <div class="link-box">
        <h3 style="margin: 0 0 8px;">🔗 Link de agendamento público</h3>
        <p style="margin: 0 0 8px; font-size: 14px;">Compartilhe este link com seus clientes para eles agendarem online:</p>
        <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
            <input type="text" id="publicLink" style="flex:1; min-width: 200px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;" readonly>
            <button onclick="copyPublicLink()">Copiar</button>
        </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 6px;">
        <button onclick="window.location.href='/company/companies.html'">+ Nova Empresa</button>
        <button onclick="window.location.href='/company/edit-company.html'">Editar / Excluir Empresa</button>
        <button onclick="window.location.href='/company/services.html'">Serviços</button>
        <button onclick="window.location.href='/company/schedule.html'">Agenda</button>
        <button onclick="window.location.href='/company/employees.html'">Funcionários</button>
        <button onclick="window.location.href='/company/settings.html'">Configurações</button>
        <button onclick="window.location.href='/shared/weekview.html'">Agenda Semanal</button>
        <button class="btn-danger" onclick="logout()">Sair</button>
    </div>

    <script>
        const API_URL = "http://localhost:5182";

        const userType = localStorage.getItem("userType");
        if (userType !== "Company") {
            window.location.href = "/shared/login.html";
        }

        function generatePublicLink() {
            const companyId = localStorage.getItem("companyId");
            if (!companyId) return "";
            // Gera link com query string
            return window.location.origin + "/public-agendar.html?companyId=" + companyId;
        }

        function copyPublicLink() {
            const input = document.getElementById('publicLink');
            if (!input) return;
            input.select();
            navigator.clipboard.writeText(input.value).then(() => {
                alert('Link copiado para a área de transferência!');
            }).catch(() => {
                document.execCommand('copy');
                alert('Link copiado para a área de transferência!');
            });
        }

        async function loadCompanies() {
            const token = localStorage.getItem("token");
            if (!token) return;
            try {
                const resp = await fetch(`${API_URL}/companies`, {
                    headers: { "Authorization": "Bearer " + token }
                });
                const data = await resp.json();
                const container = document.getElementById('companySelector');
                if (data.length === 0) {
                    container.innerHTML = '<p>Nenhuma empresa. <a href="/company/companies.html">Criar empresa</a></p>';
                    return;
                }
                let html = '<label for="companySelect">Empresa ativa: </label>';
                html += '<select id="companySelect" onchange="selectCompany()">';
                data.forEach(c => {
                    const selected = c.id === localStorage.getItem("companyId") ? 'selected' : '';
                    html += `<option value="${c.id}" ${selected}>${c.name}</option>`;
                });
                html += '</select>';
                container.innerHTML = html;

                // Atualiza o link
                const linkInput = document.getElementById('publicLink');
                if (linkInput) linkInput.value = generatePublicLink();
            } catch (e) {
                console.error('Erro ao carregar empresas:', e);
                document.getElementById('companySelector').innerHTML = '<p>Erro ao carregar empresas.</p>';
            }
        }

        async function selectCompany() {
            const companyId = document.getElementById('companySelect').value;
            const token = localStorage.getItem("token");
            try {
                const resp = await fetch(`${API_URL}/companies/select`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({ companyId })
                });
                const data = await resp.json();
                if (data.token) {
                    localStorage.setItem("token", data.token);
                    localStorage.setItem("companyId", data.companyId);
                    location.reload();
                }
            } catch (e) {
                console.error('Erro ao selecionar empresa:', e);
                alert('Erro ao trocar de empresa.');
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = "/shared/login.html";
        }

        window.onload = function() {
            loadCompanies();
        };
    </script>
</body>
</html>
