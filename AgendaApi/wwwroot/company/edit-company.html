<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Empresa - AgendaPro</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div class="container">
    <h2>🏢 Editar Empresa</h2>
    <p class="text-muted">Altere os dados da sua empresa ou exclua-a permanentemente.</p>

    <div class="card" style="margin-bottom: 20px;">
        <div class="form-group">
            <label for="companySelect">Empresa</label>
            <select id="companySelect" onchange="loadCompany()"></select>
        </div>
    </div>

    <div class="card" id="company-form">
        <div class="form-group">
            <label for="companyName">Nome da empresa</label>
            <input type="text" id="companyName" placeholder="Ex: Barbearia do João">
        </div>
        <div class="form-group">
            <label for="category">Categoria</label>
            <input type="text" id="category" placeholder="Ex: Barbearia, Salão, Clínica">
        </div>
        <div class="flex mt-1">
            <button class="btn btn-primary" onclick="updateCompany()">💾 Salvar Alterações</button>
            <button class="btn btn-danger" onclick="deleteCompany()">🗑️ Excluir Empresa</button>
        </div>
        <div class="flex mt-1">
            <button class="btn btn-outline" onclick="window.location.href='/company/dashboard-empresa.html'">⬅️ Voltar</button>
        </div>
    </div>

    <div id="message" class="alert" style="display:none;"></div>
</div>

<!-- Estilos adicionais para mensagem e select (já que o CSS unificado não tem isso) -->
<style>
    /* Mensagem de alerta */
    #message {
        padding: 12px 16px;
        border-radius: 8px;
        margin-top: 16px;
        font-weight: 500;
        display: none;
    }
    #message.error {
        display: block;
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fecaca;
    }
    #message.success {
        display: block;
        background: #dcfce7;
        color: #166534;
        border: 1px solid #bbf7d0;
    }
    /* Select do card */
    #companySelect {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid #d1d9e6;
        border-radius: 8px;
        font-size: 15px;
        background: white;
        font-family: inherit;
    }
    #companySelect:focus {
        outline: none;
        border-color: #1e88e5;
        box-shadow: 0 0 0 3px rgba(30,136,229,0.15);
    }
</style>

<script>
    const API_URL = "http://localhost:5182";
    let currentCompanyId = null;

    function getToken() { return localStorage.getItem("token"); }

    async function loadCompanies() {
        const token = getToken();
        if (!token) { window.location.href = "/shared/login.html"; return; }
        try {
            const resp = await fetch(`${API_URL}/companies`, {
                headers: { "Authorization": "Bearer " + token }
            });
            if (!resp.ok) throw new Error("Erro ao carregar empresas");
            const data = await resp.json();
            const select = document.getElementById('companySelect');
            select.innerHTML = '';
            if (data.length === 0) {
                select.innerHTML = '<option value="">Nenhuma empresa</option>';
                showMessage('Você não tem empresas. Crie uma primeiro.', 'error');
                return;
            }
            data.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = c.name;
                select.appendChild(opt);
            });
            // Selecionar a empresa ativa (ou a primeira)
            const activeId = localStorage.getItem("companyId");
            if (activeId && data.some(c => c.id === activeId)) {
                select.value = activeId;
            } else {
                select.value = data[0].id;
            }
            loadCompany();
        } catch (e) {
            console.error(e);
            showMessage('Erro ao carregar empresas: ' + e.message, 'error');
        }
    }

    async function loadCompany() {
        const companyId = document.getElementById('companySelect').value;
        if (!companyId) {
            document.getElementById('companyName').value = '';
            document.getElementById('category').value = '';
            return;
        }
        currentCompanyId = companyId;
        const token = getToken();
        try {
            const resp = await fetch(`${API_URL}/companies`, {
                headers: { "Authorization": "Bearer " + token }
            });
            const data = await resp.json();
            const company = data.find(c => c.id === companyId);
            if (!company) {
                showMessage('Empresa não encontrada.', 'error');
                return;
            }
            document.getElementById('companyName').value = company.name || '';
            document.getElementById('category').value = company.category || '';
            showMessage('', '');
        } catch (e) {
            console.error(e);
            showMessage('Erro ao carregar empresa: ' + e.message, 'error');
        }
    }

    async function updateCompany() {
        const name = document.getElementById('companyName').value.trim();
        const category = document.getElementById('category').value.trim();
        if (!name || !category) {
            showMessage('Preencha nome e categoria.', 'error');
            return;
        }
        if (!currentCompanyId) {
            showMessage('Selecione uma empresa.', 'error');
            return;
        }
        const token = getToken();
        try {
            const resp = await fetch(`${API_URL}/companies/${currentCompanyId}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({ name, category })
            });
            if (!resp.ok) {
                const errorText = await resp.text();
                throw new Error(`Erro ${resp.status}: ${errorText}`);
            }
            showMessage('Empresa atualizada com sucesso!', 'success');
            loadCompanies();
        } catch (e) {
            console.error(e);
            showMessage('Erro ao atualizar: ' + e.message, 'error');
        }
    }

    async function deleteCompany() {
        if (!currentCompanyId) {
            showMessage('Selecione uma empresa.', 'error');
            return;
        }
        if (!confirm(`Tem certeza que deseja excluir esta empresa permanentemente?\nTodos os serviços, funcionários e agendamentos serão removidos.`)) {
            return;
        }
        const token = getToken();
        try {
            const resp = await fetch(`${API_URL}/companies/${currentCompanyId}`, {
                method: "DELETE",
                headers: { "Authorization": "Bearer " + token }
            });
            if (!resp.ok) {
                const errorText = await resp.text();
                throw new Error(`Erro ${resp.status}: ${errorText}`);
            }
            const data = await resp.json();
            showMessage(data.message || 'Empresa excluída com sucesso!', 'success');
            if (localStorage.getItem("companyId") === currentCompanyId) {
                localStorage.removeItem("companyId");
            }
            await loadCompanies();
            document.getElementById('companyName').value = '';
            document.getElementById('category').value = '';
            currentCompanyId = null;
            setTimeout(() => {
                window.location.href = '/company/dashboard-empresa.html';
            }, 2000);
        } catch (e) {
            console.error(e);
            showMessage('Erro ao excluir: ' + e.message, 'error');
        }
    }

    function showMessage(text, type) {
        const el = document.getElementById('message');
        el.textContent = text;
        el.className = 'alert ' + (type || '');
        el.style.display = text ? 'block' : 'none';
    }

    window.onload = loadCompanies;
</script>

</body>
</html>
