<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Funcionários</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { font-family: Arial; padding: 20px; max-width: 700px; margin: 0 auto; }
        input, button { display: block; width: 100%; margin-bottom: 10px; padding: 8px; }
        button { background: #4CAF50; color: white; border: none; cursor: pointer; }
        button:hover { background: #45a049; }
        .employee-item { padding: 10px; border-bottom: 1px solid #ccc; display: flex; align-items: center; gap: 15px; }
        .employee-item img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .actions { display: flex; gap: 5px; }
        .actions button { padding: 5px 10px; font-size: 12px; width: auto; }
        .edit-btn { background: #2196F3; }
        .delete-btn { background: #f44336; }
        #form-container { border: 1px solid #ddd; padding: 15px; margin-bottom: 20px; background: #f9f9f9; }
        #form-container h3 { margin-top: 0; }
    </style>
</head>
<body>
    <h2>Gerenciar Funcionários</h2>

    <button onclick="window.location.href='dashboard-empresa.html'">Voltar ao Dashboard</button>

    <div id="form-container">
        <h3 id="form-title">Novo Funcionário</h3>
        <input type="hidden" id="edit-id">
        <input type="text" id="name" placeholder="Nome completo">
        <input type="text" id="specialty" placeholder="Especialidade (ex: Cabelereiro)">
        <input type="text" id="photoUrl" placeholder="URL da foto (opcional)">
        <button id="save-btn" onclick="saveEmployee()">Salvar</button>
        <button onclick="cancelEdit()" style="background: #999;">Cancelar</button>
    </div>

    <h3>Lista de Funcionários</h3>
    <div id="employee-list"></div>

    <script src="/js/employees.js"></script>
</body>
</html>
