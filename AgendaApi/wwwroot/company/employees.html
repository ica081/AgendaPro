<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funcionários - AgendaPro</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        /* ===== ESTILOS ESPECÍFICOS (adaptados para dark mode) ===== */

        /* Lista de funcionários */
        #employee-list {
            margin-top: 12px;
        }
        .employee-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            background: var(--card-bg);
            border-radius: 8px;
            margin-bottom: 6px;
            transition: background 0.15s ease;
        }
        .employee-item:hover {
            background: var(--hover-bg);
        }
        .employee-item img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-color);
        }
        .employee-info {
            flex: 1;
        }
        .employee-name {
            font-weight: 600;
            color: var(--text-color);
        }
        .employee-specialty {
            font-size: 14px;
            color: var(--muted);
        }
        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .actions button {
            padding: 6px 14px;
            font-size: 13px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .edit-btn {
            background: var(--primary);
            color: var(--text-on-primary);
        }
        .edit-btn:hover {
            background: var(--primary-hover);
        }
        .delete-btn {
            background: var(--danger);
            color: var(--text-on-primary);
        }
        .delete-btn:hover {
            background: #dc2626;
        }
        [data-theme="dark"] .delete-btn:hover {
            background: #ef4444;
        }

        /* Ajuste para o formulário */
        #form-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
        }
        #form-container input {
            width: 100%;
        }
        #form-container .flex {
            margin-top: 6px;
        }

        /* Botão Cancelar do formulário */
        #form-container .btn-outline {
            background: #999;
            color: white;
        }
        [data-theme="dark"] #form-container .btn-outline {
            background: #4b5563;
            color: #e2e8f0;
        }
        #form-container .btn-outline:hover {
            background: #777;
        }
        [data-theme="dark"] #form-container .btn-outline:hover {
            background: #374151;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>👥 Gerenciar Funcionários</h2>
    <p class="text-muted">Cadastre e gerencie os profissionais da sua empresa.</p>

    <div class="flex mt-1 mb-2">
        <button class="btn btn-outline" onclick="window.location.href='dashboard-empresa.html'">⬅️ Voltar ao Dashboard</button>
    </div>

    <!-- Formulário -->
    <div class="card" id="form-container">
        <h3 id="form-title">Novo Funcionário</h3>
        <input type="hidden" id="edit-id">
        <div class="form-group">
            <label for="name">Nome completo</label>
            <input type="text" id="name" placeholder="Ex: João Silva">
        </div>
        <div class="form-group">
            <label for="specialty">Especialidade</label>
            <input type="text" id="specialty" placeholder="Ex: Cabeleireiro">
        </div>
        <div class="form-group">
            <label for="photoUrl">URL da foto (opcional)</label>
            <input type="text" id="photoUrl" placeholder="https://exemplo.com/foto.jpg">
        </div>
        <div class="flex">
            <button class="btn btn-primary" id="save-btn" onclick="saveEmployee()">💾 Salvar</button>
            <button class="btn btn-outline" onclick="cancelEdit()">Cancelar</button>
        </div>
    </div>

    <hr>

    <h3>Lista de Funcionários</h3>
    <div id="employee-list"></div>
</div>

<script src="/js/employees.js"></script>
<script src="/js/theme.js"></script>
</body>
</html>
