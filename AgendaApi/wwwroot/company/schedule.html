<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda - AgendaPro</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        /* ===== ESTILOS ESPECÍFICOS DA AGENDA (adaptados para dark mode) ===== */

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
        }
        .modal-content h3 {
            color: var(--text-color);
        }

        /* Eventos (agendamentos do dia) */
        .event {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            margin: 6px 0;
            border-left: 5px solid var(--success);
            background: var(--light-bg);
            border-radius: 8px;
            flex-wrap: wrap;
            color: var(--text-color);
        }
        .event button {
            padding: 4px 12px;
            font-size: 13px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-edit {
            background: var(--primary);
            color: var(--text-on-primary);
        }
        .btn-edit:hover {
            background: var(--primary-hover);
        }
        .btn-cancel {
            background: var(--danger);
            color: var(--text-on-primary);
        }
        .btn-cancel:hover {
            background: #dc2626;
        }
        [data-theme="dark"] .btn-cancel:hover {
            background: #ef4444;
        }

        /* Grade de horários (time-grid) */
        #time-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin: 12px 0;
        }
        .time-slot {
            padding: 10px 4px;
            background: var(--light-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
            color: var(--text-color);
        }
        .time-slot:hover:not(.occupied) {
            background: var(--hover-bg);
        }
        .time-slot.occupied {
            background: var(--danger-bg);
            border-color: var(--danger);
            cursor: not-allowed;
            opacity: 0.7;
        }
        .time-slot.selected {
            background: var(--primary);
            color: var(--text-on-primary);
            border-color: var(--primary);
        }

        /* Ajustes no formulário dentro do card */
        #form-container .btn-outline {
            background: #999;
            color: white;
        }
        [data-theme="dark"] #form-container .btn-outline {
            background: #4b5563;
            color: #e2e8f0;
        }
        #form-container .btn-outline:hover {
            background: #777;
        }
        [data-theme="dark"] #form-container .btn-outline:hover {
            background: #374151;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📅 Agenda</h2>

    <div class="controls flex" style="margin-bottom: 20px;">
        <label for="selectedDate" style="font-weight: 500; color: var(--text-color);">Data:</label>
        <input type="date" id="selectedDate">
        <button class="btn btn-primary" onclick="loadDay()">Carregar</button>
        <button class="btn btn-outline" onclick="window.location.href='dashboard-empresa.html'">Voltar</button>
    </div>

    <h3>Horários disponíveis</h3>
    <div id="time-grid" class="slot-grid"></div>

    <div id="form-container" class="card" style="display:none; margin-top: 20px;">
        <h3>Novo Agendamento</h3>
        <div class="form-group">
            <label for="services">Serviço</label>
            <select id="services"></select>
        </div>
        <div class="form-group">
            <label for="employees">Profissional</label>
            <select id="employees"></select>
        </div>
        <div class="form-group">
            <label for="clientName">Nome do cliente</label>
            <input type="text" id="clientName" placeholder="Ex: João Silva">
        </div>
        <div class="form-group">
            <label for="clientEmail">E-mail do cliente</label>
            <input type="email" id="clientEmail" placeholder="joao@email.com">
        </div>
        <input type="hidden" id="selectedTime">
        <div class="flex">
            <button class="btn btn-success" onclick="createSchedule()">Agendar</button>
            <button class="btn btn-outline" onclick="cancelForm()">Cancelar</button>
        </div>
    </div>

    <hr>

    <h3>Agendamentos do dia</h3>
    <div id="calendar"></div>

    <!-- Modal de edição -->
    <div id="edit-modal" class="modal-overlay">
        <div class="modal-content card">
            <h3 id="edit-title">Editar Agendamento</h3>
            <input type="hidden" id="edit-id">
            <div class="form-group">
                <label for="edit-services">Serviço</label>
                <select id="edit-services"></select>
            </div>
            <div class="form-group">
                <label for="edit-employees">Profissional</label>
                <select id="edit-employees"></select>
            </div>
            <div class="form-group">
                <label for="edit-clientName">Cliente</label>
                <input type="text" id="edit-clientName" placeholder="Cliente">
            </div>
            <div class="form-group">
                <label for="edit-clientEmail">E-mail</label>
                <input type="email" id="edit-clientEmail" placeholder="E-mail">
            </div>
            <div class="form-group">
                <label for="edit-startTime">Data/Hora</label>
                <input type="datetime-local" id="edit-startTime">
            </div>
            <div class="flex">
                <button class="btn btn-success" onclick="updateSchedule()">Salvar</button>
                <button class="btn btn-outline" onclick="closeEditModal()" style="background:#999; color:white;">Cancelar</button>
            </div>
        </div>
    </div>
</div>

<script src="/js/schedule.js"></script>
<script src="/js/theme.js"></script>
</body>
</html>
