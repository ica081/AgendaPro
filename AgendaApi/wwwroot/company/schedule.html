<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda - AgendaPro</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div class="container">
    <h2>📅 Agenda</h2>

    <div class="controls flex" style="margin-bottom: 20px;">
        <label for="selectedDate" style="font-weight: 500;">Data:</label>
        <input type="date" id="selectedDate">
        <button class="btn btn-primary" onclick="loadDay()">Carregar</button>
        <button class="btn btn-outline" onclick="window.location.href='dashboard-empresa.html'">Voltar</button>
    </div>

    <h3>Horários disponíveis</h3>
    <div id="time-grid" class="slot-grid"></div>

    <div id="form-container" class="card" style="display:none; margin-top: 20px;">
        <h3>Novo Agendamento</h3>
        <div class="form-group">
            <label for="services">Serviço</label>
            <select id="services"></select>
        </div>
        <div class="form-group">
            <label for="employees">Profissional</label>
            <select id="employees"></select>
        </div>
        <div class="form-group">
            <label for="clientName">Nome do cliente</label>
            <input type="text" id="clientName" placeholder="Ex: João Silva">
        </div>
        <div class="form-group">
            <label for="clientEmail">E-mail do cliente</label>
            <input type="email" id="clientEmail" placeholder="joao@email.com">
        </div>
        <input type="hidden" id="selectedTime">
        <div class="flex">
            <button class="btn btn-success" onclick="createSchedule()">Agendar</button>
            <button class="btn btn-outline" onclick="cancelForm()" style="background:#999; color:white;">Cancelar</button>
        </div>
    </div>

    <hr>

    <h3>Agendamentos do dia</h3>
    <div id="calendar"></div>

    <!-- Modal de edição -->
    <div id="edit-modal" class="modal-overlay">
        <div class="modal-content card">
            <h3 id="edit-title">Editar Agendamento</h3>
            <input type="hidden" id="edit-id">
            <div class="form-group">
                <label for="edit-services">Serviço</label>
                <select id="edit-services"></select>
            </div>
            <div class="form-group">
                <label for="edit-employees">Profissional</label>
                <select id="edit-employees"></select>
            </div>
            <div class="form-group">
                <label for="edit-clientName">Cliente</label>
                <input type="text" id="edit-clientName" placeholder="Cliente">
            </div>
            <div class="form-group">
                <label for="edit-clientEmail">E-mail</label>
                <input type="email" id="edit-clientEmail" placeholder="E-mail">
            </div>
            <div class="form-group">
                <label for="edit-startTime">Data/Hora</label>
                <input type="datetime-local" id="edit-startTime">
            </div>
            <div class="flex">
                <button class="btn btn-success" onclick="updateSchedule()">Salvar</button>
                <button class="btn btn-outline" onclick="closeEditModal()" style="background:#999; color:white;">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="/js/schedule.js"></script>
</div>

<!-- Estilos adicionais para o modal (pois o CSS unificado não tem isso) -->
<style>
    /* Modal (já que o CSS unificado não tem estilos para modal) */
    .modal-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.5);
        z-index: 999;
        align-items: center;
        justify-content: center;
    }
    .modal-overlay.active {
        display: flex;
    }
    .modal-content {
        max-width: 500px;
        width: 90%;
        max-height: 90vh;
        overflow-y: auto;
        padding: 24px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    }
    /* Estilos para os eventos (agendamentos do dia) */
    .event {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        margin: 6px 0;
        border-left: 5px solid #22c55e;
        background: #f8fafc;
        border-radius: 8px;
        flex-wrap: wrap;
    }
    .event button {
        padding: 4px 12px;
        font-size: 13px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }
    .btn-edit {
        background: #1e88e5;
        color: white;
    }
    .btn-edit:hover {
        background: #1565c0;
    }
    .btn-cancel {
        background: #ef4444;
        color: white;
    }
    .btn-cancel:hover {
        background: #dc2626;
    }
    /* Ajuste nos slots da agenda (time-grid) */
    #time-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 10px;
        margin: 12px 0;
    }
    .time-slot {
        padding: 10px 4px;
        background: #f1f5f9;
        border: 1px solid #d1d9e6;
        border-radius: 8px;
        text-align: center;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
    }
    .time-slot:hover:not(.occupied) {
        background: #e2e8f0;
    }
    .time-slot.occupied {
        background: #fee2e2;
        border-color: #fca5a5;
        cursor: not-allowed;
        opacity: 0.7;
    }
    .time-slot.selected {
        background: #1e88e5;
        color: white;
        border-color: #1e88e5;
    }
</style>
</body>
</html>
