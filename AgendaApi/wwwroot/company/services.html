<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviços - AgendaPro</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div class="container">
    <h2>📋 Serviços</h2>
    <p class="text-muted">Gerencie os serviços oferecidos pela sua empresa.</p>

    <div class="card">
        <h3>Novo Serviço</h3>
        <div class="form-group">
            <label for="name">Nome do serviço</label>
            <input type="text" id="name" placeholder="Ex: Corte de cabelo">
        </div>
        <div class="form-group">
            <label for="price">Preço (R$)</label>
            <input type="number" id="price" placeholder="0,00" step="0.01">
        </div>
        <div class="form-group">
            <label for="duration">Duração (minutos)</label>
            <input type="number" id="duration" placeholder="30" min="5">
        </div>
        <button class="btn btn-primary" onclick="createService()">➕ Criar Serviço</button>
    </div>

    <hr>

    <h3>Serviços Cadastrados</h3>
    <ul id="list" style="list-style: none; padding: 0;"></ul>

    <div class="flex mt-2">
        <button class="btn btn-outline" onclick="window.location.href='/company/dashboard-empresa.html'">⬅️ Voltar ao Dashboard</button>
    </div>
</div>

<script src="/js/services.js"></script>
</body>
</html>
