<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar - AgendaPro</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 16px;
            padding: 30px 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .company-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .company-header h1 {
            margin: 0 0 4px;
            font-size: 26px;
            color: #1a1a2e;
        }
        .company-header p {
            margin: 0;
            color: #6b7280;
            font-size: 15px;
        }
        .month-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0 16px;
        }
        .month-nav button {
            background: #e5e7eb;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.15s;
        }
        .month-nav button:hover {
            background: #d1d5db;
        }
        .month-nav .month-label {
            font-weight: 600;
            font-size: 18px;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 20px;
        }
        .calendar-grid .day-name {
            text-align: center;
            font-weight: 600;
            font-size: 13px;
            color: #6b7280;
            padding: 8px 0;
        }
        .calendar-grid .day-cell {
            text-align: center;
            padding: 8px 0;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.15s;
            background: #f9fafb;
            border: 1px solid transparent;
            position: relative;
        }
        .calendar-grid .day-cell:hover:not(.empty):not(.disabled) {
            background: #e5e7eb;
        }
        .calendar-grid .day-cell.selected {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }
        .calendar-grid .day-cell.has-slots {
            border-color: #93c5fd;
            font-weight: 600;
        }
        .calendar-grid .day-cell.empty {
            cursor: default;
            background: transparent;
        }
        .calendar-grid .day-cell.disabled {
            color: #d1d5db;
            cursor: not-allowed;
        }
        .calendar-grid .day-cell .badge {
            display: inline-block;
            background: #2563eb;
            color: white;
            border-radius: 50%;
            font-size: 10px;
            padding: 1px 5px;
            margin-left: 4px;
        }
        .slots-container {
            margin: 20px 0;
            border-top: 1px solid #e5e7eb;
            padding-top: 16px;
        }
        .slots-container h3 {
            margin: 0 0 12px;
            font-size: 16px;
            color: #1f2937;
        }
        .slot-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .slot {
            padding: 8px 4px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            cursor: pointer;
            background: #f9fafb;
            transition: 0.15s;
        }
        .slot:hover:not(.occupied) {
            background: #e5e7eb;
        }
        .slot.occupied {
            background: #fee2e2;
            border-color: #fca5a5;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .slot.selected {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
            color: #1f2937;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }
        .form-group input:focus {
            outline: 2px solid #2563eb;
            border-color: transparent;
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            margin-top: 8px;
        }
        .btn-primary:hover {
            background: #1d4ed8;
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }
        .alert.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .alert.success {
            display: block;
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        .loading {
            text-align: center;
            color: #6b7280;
            padding: 20px 0;
        }
        .hidden { display: none; }
        .service-employee-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        .service-employee-selector select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }
        @media (max-width: 600px) {
            .calendar-grid .day-cell { font-size: 12px; padding: 6px 0; }
            .service-employee-selector { grid-template-columns: 1fr; }
            .slot-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <div id="alert" class="alert"></div>

    <div class="company-header">
        <h1 id="companyName">Carregando...</h1>
        <p id="companyCategory"></p>
    </div>

    <!-- Selector de serviço e funcionário -->
    <div class="service-employee-selector">
        <div>
            <label for="serviceSelect">Serviço</label>
            <select id="serviceSelect"><option value="">Carregando...</option></select>
        </div>
        <div>
            <label for="employeeSelect">Profissional</label>
            <select id="employeeSelect"><option value="">Carregando...</option></select>
        </div>
    </div>

    <!-- Calendário mensal -->
    <div id="calendarContainer">
        <div class="month-nav">
            <button onclick="changeMonth(-1)">◀</button>
            <span class="month-label" id="monthLabel">Carregando...</span>
            <button onclick="changeMonth(1)">▶</button>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <!-- Horários do dia selecionado -->
    <div class="slots-container" id="slotsContainer" style="display:none;">
        <h3 id="selectedDayLabel">Horários disponíveis</h3>
        <div class="slot-grid" id="slotGrid"></div>
        <p id="slotMessage" style="color: #6b7280; font-size: 14px; margin-top: 6px;"></p>
    </div>

    <!-- Dados do cliente -->
    <div id="bookingForm" style="display:none; margin-top: 16px;">
        <div class="form-group">
            <label for="clientName">Seu nome</label>
            <input type="text" id="clientName" placeholder="Ex: João Silva">
        </div>
        <div class="form-group">
            <label for="clientPhone">Telefone</label>
            <input type="text" id="clientPhone" placeholder="(11) 99999-9999">
        </div>
        <button class="btn-primary" id="bookBtn" onclick="createBooking()">Agendar</button>
    </div>

    <div style="margin-top: 24px; font-size: 13px; color: #9ca3af; text-align: center;">
        Powered by AgendaPro
    </div>
</div>

<script>
    const API_URL = "http://localhost:5182";
    const path = window.location.pathname;
    const parts = path.split('/');
    const COMPANY_ID = parts[2]; // ex: .../public-agendar.html/123e4567...

    let currentYear, currentMonth;
    let selectedDate = null;
    let selectedSlot = null;
    let serviceList = [];
    let employeeList = [];
    let daySlotsMap = {}; // cache de slots por data para evitar múltiplas requisições

    // ====== Utilitários ======
    function showAlert(msg, type) {
        const el = document.getElementById('alert');
        el.textContent = msg;
        el.className = 'alert ' + type;
        el.style.display = 'block';
        setTimeout(() => { el.style.display = 'none'; }, 5000);
    }

    // ====== Carregar dados iniciais ======
    async function loadCompany() {
        try {
            const resp = await fetch(`${API_URL}/public/company/${COMPANY_ID}`);
            if (!resp.ok) throw new Error('Empresa não encontrada');
            const data = await resp.json();
            document.getElementById('companyName').textContent = data.name || 'Empresa';
            document.getElementById('companyCategory').textContent = data.category || '';
        } catch (e) {
            document.getElementById('companyName').textContent = 'Empresa não encontrada';
            showAlert('Erro ao carregar dados da empresa', 'error');
        }
    }

    async function loadServices() {
        const select = document.getElementById('serviceSelect');
        select.innerHTML = '<option value="">Carregando...</option>';
        try {
            const resp = await fetch(`${API_URL}/public/services?companyId=${COMPANY_ID}`);
            if (!resp.ok) throw new Error();
            const data = await resp.json();
            serviceList = data;
            select.innerHTML = '';
            if (data.length === 0) {
                select.innerHTML = '<option value="">Nenhum serviço disponível</option>';
                return;
            }
            data.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.id;
                opt.textContent = `${s.name} (${s.durationMinutes} min)`;
                select.appendChild(opt);
            });
            loadEmployees();
        } catch (e) {
            select.innerHTML = '<option value="">Erro ao carregar serviços</option>';
        }
    }

    async function loadEmployees() {
        const select = document.getElementById('employeeSelect');
        select.innerHTML = '<option value="">Carregando...</option>';
        try {
            const resp = await fetch(`${API_URL}/public/employees?companyId=${COMPANY_ID}`);
            if (!resp.ok) throw new Error();
            const data = await resp.json();
            employeeList = data;
            select.innerHTML = '';
            if (data.length === 0) {
                select.innerHTML = '<option value="">Nenhum profissional disponível</option>';
                return;
            }
            data.forEach(e => {
                const opt = document.createElement('option');
                opt.value = e.id;
                opt.textContent = e.name + (e.specialty ? ` (${e.specialty})` : '');
                select.appendChild(opt);
            });
            initCalendar();
        } catch (e) {
            select.innerHTML = '<option value="">Erro ao carregar profissionais</option>';
        }
    }

    // ====== Calendário ======
    function initCalendar() {
        const today = new Date();
        currentYear = today.getFullYear();
        currentMonth = today.getMonth();
        renderCalendar();
    }

    function changeMonth(delta) {
        currentMonth += delta;
        if (currentMonth < 0) { currentMonth = 11; currentYear--; }
        if (currentMonth > 11) { currentMonth = 0; currentYear++; }
        renderCalendar();
    }

    async function renderCalendar() {
        const monthNames = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
                            'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
        document.getElementById('monthLabel').textContent = `${monthNames[currentMonth]} ${currentYear}`;

        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';

        const firstDay = new Date(currentYear, currentMonth, 1).getDay();
        const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        const today = new Date();
        const todayStr = today.toISOString().split('T')[0];

        // Dias da semana
        const dayNames = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
        dayNames.forEach(d => {
            const el = document.createElement('div');
            el.className = 'day-name';
            el.textContent = d;
            grid.appendChild(el);
        });

        // Dias vazios antes do primeiro dia
        for (let i = 0; i < firstDay; i++) {
            const el = document.createElement('div');
            el.className = 'day-cell empty';
            grid.appendChild(el);
        }

        // Dias do mês
        const serviceId = document.getElementById('serviceSelect').value;
        const employeeId = document.getElementById('employeeSelect').value;

        for (let day = 1; day <= daysInMonth; day++) {
            const dateObj = new Date(currentYear, currentMonth, day);
            const dateStr = dateObj.toISOString().split('T')[0];
            const hasSlots = await dayHasSlots(dateStr, serviceId, employeeId);

            const el = document.createElement('div');
            el.className = 'day-cell';
            el.dataset.date = dateStr;

            if (hasSlots) {
                el.classList.add('has-slots');
                el.style.cursor = 'pointer';
            } else {
                el.classList.add('disabled');
            }
            // Desabilitar dias passados
            if (dateStr < todayStr) {
                el.classList.add('disabled');
                el.style.cursor = 'not-allowed';
            }
            el.textContent = day;

            if (hasSlots && dateStr >= todayStr) {
                el.onclick = function() {
                    selectDay(dateStr);
                };
            }

            // Se este dia for o selecionado, marcar como selected
            if (dateStr === selectedDate) {
                el.classList.add('selected');
            }

            grid.appendChild(el);
        }
    }

    async function dayHasSlots(dateStr, serviceId, employeeId) {
        if (!serviceId || !employeeId) return false;
        try {
            // Tentar obter do cache
            const cacheKey = `${dateStr}_${serviceId}_${employeeId}`;
            if (daySlotsMap[cacheKey] !== undefined) {
                return daySlotsMap[cacheKey].length > 0;
            }
            const resp = await fetch(`${API_URL}/public/slots?companyId=${COMPANY_ID}&date=${dateStr}`);
            if (!resp.ok) return false;
            const slots = await resp.json();
            daySlotsMap[cacheKey] = slots;
            return slots.length > 0;
        } catch (e) {
            return false;
        }
    }

    // ====== Selecionar um dia ======
    async function selectDay(dateStr) {
        // Atualizar visual do calendário
        document.querySelectorAll('.day-cell').forEach(el => {
            el.classList.remove('selected');
        });
        const selectedElement = document.querySelector(`.day-cell[data-date="${dateStr}"]`);
        if (selectedElement) {
            selectedElement.classList.add('selected');
        }

        // Limpar seleção anterior de slot
        selectedSlot = null;
        document.getElementById('bookingForm').style.display = 'none';

        // Buscar slots e ocupados
        const serviceId = document.getElementById('serviceSelect').value;
        const employeeId = document.getElementById('employeeSelect').value;

        if (!serviceId || !employeeId) {
            showAlert('Selecione serviço e profissional primeiro.', 'error');
            return;
        }

        const container = document.getElementById('slotsContainer');
        const grid = document.getElementById('slotGrid');
        const msg = document.getElementById('slotMessage');
        const label = document.getElementById('selectedDayLabel');

        const dateObj = new Date(dateStr);
        label.textContent = `Horários disponíveis em ${dateObj.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}`;

        grid.innerHTML = '<div class="loading">Carregando horários...</div>';
        container.style.display = 'block';

        try {
            // 1. Buscar slots teóricos (disponíveis)
            const slotsResp = await fetch(`${API_URL}/public/slots?companyId=${COMPANY_ID}&date=${dateStr}`);
            if (!slotsResp.ok) throw new Error('Erro ao buscar horários');
            const allSlots = await slotsResp.json();

            // 2. Buscar horários ocupados
            const occupiedResp = await fetch(`${API_URL}/public/occupied-slots?companyId=${COMPANY_ID}&date=${dateStr}&employeeId=${employeeId}`);
            let occupied = [];
            if (occupiedResp.ok) {
                occupied = await occupiedResp.json();
            }

            // 3. Renderizar
            grid.innerHTML = '';
            if (allSlots.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#6b7280;">Nenhum horário disponível neste dia</div>';
                msg.textContent = '';
                return;
            }

            // Guardar slots para uso posterior (createBooking)
            selectedDate = dateStr;

            allSlots.forEach(slot => {
                const isOccupied = occupied.includes(slot);
                const div = document.createElement('div');
                div.className = 'slot' + (isOccupied ? ' occupied' : '');
                div.textContent = slot;
                div.dataset.time = slot;
                if (!isOccupied) {
                    div.onclick = function() {
                        document.querySelectorAll('.slot').forEach(el => el.classList.remove('selected'));
                        div.classList.add('selected');
                        selectedSlot = slot;
                        document.getElementById('bookingForm').style.display = 'block';
                    };
                }
                grid.appendChild(div);
            });

            const availableCount = allSlots.length - occupied.length;
            msg.textContent = `${availableCount} horário(s) disponível(is)${occupied.length > 0 ? ` (${occupied.length} ocupado(s))` : ''}`;
            document.getElementById('bookingForm').style.display = 'none';

        } catch (e) {
            console.error(e);
            grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#ef4444;">Erro ao carregar horários</div>';
            msg.textContent = '';
        }
    }

    // ====== Criar agendamento ======
    async function createBooking() {
        const serviceId = document.getElementById('serviceSelect').value;
        const employeeId = document.getElementById('employeeSelect').value;
        const clientName = document.getElementById('clientName').value.trim();
        const clientPhone = document.getElementById('clientPhone').value.trim();
        const date = selectedDate;

        if (!serviceId || !employeeId || !clientName || !clientPhone || !selectedSlot || !date) {
            showAlert('Preencha todos os campos e selecione um horário.', 'error');
            return;
        }

        const startDateTime = new Date(date + 'T' + selectedSlot);
        const year = startDateTime.getFullYear();
        const month = String(startDateTime.getMonth()+1).padStart(2,'0');
        const day = String(startDateTime.getDate()).padStart(2,'0');
        const hours = String(startDateTime.getHours()).padStart(2,'0');
        const minutes = String(startDateTime.getMinutes()).padStart(2,'0');
        const localDateTime = `${year}-${month}-${day}T${hours}:${minutes}:00`;

        const body = {
            serviceId,
            employeeId,
            clientName,
            clientPhone,
            startTime: localDateTime
        };

        const btn = document.getElementById('bookBtn');
        btn.disabled = true;
        btn.textContent = 'Agendando...';

        try {
            const resp = await fetch(`${API_URL}/public/schedules?companyId=${COMPANY_ID}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (!resp.ok) {
                const errorText = await resp.text();
                throw new Error(errorText || 'Erro ao agendar');
            }

            showAlert('Agendamento realizado com sucesso!', 'success');
            // Limpar campos
            document.getElementById('clientName').value = '';
            document.getElementById('clientPhone').value = '';
            document.querySelectorAll('.slot.selected').forEach(el => el.classList.remove('selected'));
            selectedSlot = null;
            document.getElementById('bookingForm').style.display = 'none';
            // Recarregar o dia para atualizar ocupados
            await selectDay(date);
            // Recarregar o calendário para atualizar indicadores de slots
            renderCalendar();
        } catch (e) {
            showAlert('Erro ao agendar: ' + e.message, 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Agendar';
        }
    }

    // ====== Event listeners ======
    document.getElementById('serviceSelect').addEventListener('change', () => {
        // Limpar cache e re-renderizar
        daySlotsMap = {};
        selectedDate = null;
        document.getElementById('slotsContainer').style.display = 'none';
        document.getElementById('bookingForm').style.display = 'none';
        selectedSlot = null;
        renderCalendar();
    });
    document.getElementById('employeeSelect').addEventListener('change', () => {
        daySlotsMap = {};
        selectedDate = null;
        document.getElementById('slotsContainer').style.display = 'none';
        document.getElementById('bookingForm').style.display = 'none';
        selectedSlot = null;
        renderCalendar();
    });

    // ====== Inicialização ======
    async function init() {
        if (!COMPANY_ID) {
            document.getElementById('companyName').textContent = 'Link inválido';
            showAlert('Link inválido. Verifique o endereço.', 'error');
            return;
        }

        await loadCompany();
        await loadServices();
    }

    init();
</script>
</body>
</html>
