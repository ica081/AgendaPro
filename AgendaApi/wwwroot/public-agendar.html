<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar - AgendaPro</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        /* ===== ESTILOS ESPECÍFICOS DA PÁGINA PÚBLICA ===== */
        .company-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .company-header h1 {
            margin: 0 0 4px;
            font-size: 26px;
            color: #1a1a2e;
        }
        .company-header p {
            margin: 0;
            color: #6b7280;
            font-size: 15px;
        }

        .service-employee-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        .service-employee-selector select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }

        /* Sobrescreve cores do CSS global para manter identidade visual */
        .btn-primary {
            background: #2563eb !important;
        }
        .btn-primary:hover {
            background: #1d4ed8 !important;
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .calendar-grid .day-cell.selected {
            background: #2563eb !important;
            color: white !important;
            border-color: #2563eb !important;
        }
        .calendar-grid .day-cell.has-slots {
            border-color: #93c5fd !important;
            font-weight: 600;
        }

        .slot.selected {
            background: #2563eb !important;
            color: white !important;
            border-color: #2563eb !important;
        }
        .slot.occupied {
            background: #fee2e2 !important;
            border-color: #fca5a5 !important;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .slots-container {
            margin: 20px 0;
            border-top: 1px solid #e5e7eb;
            padding-top: 16px;
        }
        .slots-container h3 {
            margin: 0 0 12px;
            font-size: 16px;
            color: #1f2937;
        }

        .form-group input:focus {
            outline: 2px solid #2563eb !important;
            border-color: transparent !important;
        }

        @media (max-width: 600px) {
            .service-employee-selector {
                grid-template-columns: 1fr;
            }
            .slot-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <div id="alert" class="alert"></div>

    <div class="company-header">
        <h1 id="companyName">Carregando...</h1>
        <p id="companyCategory"></p>
    </div>

    <div class="service-employee-selector">
        <div>
            <label for="serviceSelect" style="font-weight:500; display:block; margin-bottom:4px;">Serviço</label>
            <select id="serviceSelect"><option value="">Carregando...</option></select>
        </div>
        <div>
            <label for="employeeSelect" style="font-weight:500; display:block; margin-bottom:4px;">Profissional</label>
            <select id="employeeSelect"><option value="">Carregando...</option></select>
        </div>
    </div>

    <div id="calendarContainer">
        <div class="month-nav">
            <button onclick="changeMonth(-1)">◀</button>
            <span class="month-label" id="monthLabel">Carregando...</span>
            <button onclick="changeMonth(1)">▶</button>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div class="slots-container" id="slotsContainer" style="display:none;">
        <h3><span id="selectedDayLabel">Horários disponíveis</span></h3>
        <div class="slot-grid" id="slotGrid"></div>
        <p id="slotMessage" style="color: #6b7280; font-size: 14px; margin-top: 6px;"></p>
    </div>

    <div id="bookingForm" style="display:none; margin-top: 16px;">
        <div class="form-group">
            <label for="clientName">Seu nome</label>
            <input type="text" id="clientName" placeholder="Ex: João Silva">
        </div>
        <div class="form-group">
            <label for="clientEmail">E-mail</label>
            <input type="email" id="clientEmail" placeholder="joao@email.com">
        </div>
        <div class="form-group">
            <label for="clientPhone">Telefone</label>
            <input type="tel" id="clientPhone" placeholder="(99) 99999-9999">
        </div>
        <button class="btn btn-primary btn-block" id="bookBtn" onclick="createBooking()">Agendar</button>
    </div>

    <div style="margin-top: 24px; font-size: 13px; color: #9ca3af; text-align: center;">
        Powered by AgendaPro
    </div>
</div>

<script>
    const API_URL = "https://agendaapi-4772.onrender.com";

    function getCompanyIdFromUrl() {
        const urlParams = new URLSearchParams(window.location.search);
        const fromQuery = urlParams.get('companyId');
        if (fromQuery) return fromQuery;
        const path = window.location.pathname;
        const parts = path.split('/');
        if (parts.length >= 3 && parts[2]) {
            return parts[2];
        }
        return null;
    }

    const COMPANY_ID = getCompanyIdFromUrl();

    let currentYear, currentMonth;
    let selectedDate = null;
    let selectedSlot = null;
    let serviceList = [];
    let employeeList = [];
    let daySlotsMap = {};

    function showAlert(msg, type) {
        const el = document.getElementById('alert');
        el.textContent = msg;
        el.className = 'alert ' + type;
        el.style.display = 'block';
        setTimeout(() => { el.style.display = 'none'; }, 5000);
    }

    async function loadCompany() {
        try {
            const resp = await fetch(`${API_URL}/public/company/${COMPANY_ID}`);
            if (!resp.ok) throw new Error('Empresa não encontrada');
            const data = await resp.json();
            document.getElementById('companyName').textContent = data.name || 'Empresa';
            document.getElementById('companyCategory').textContent = data.category || '';
        } catch (e) {
            document.getElementById('companyName').textContent = 'Empresa não encontrada';
            showAlert('Erro ao carregar dados da empresa', 'error');
        }
    }

    async function loadServices() {
        const select = document.getElementById('serviceSelect');
        select.innerHTML = '<option value="">Carregando...</option>';
        try {
            const resp = await fetch(`${API_URL}/public/services?companyId=${COMPANY_ID}`);
            if (!resp.ok) throw new Error();
            const data = await resp.json();
            serviceList = data;
            select.innerHTML = '';
            if (data.length === 0) {
                select.innerHTML = '<option value="">Nenhum serviço disponível</option>';
                return;
            }
            data.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.id;
                opt.textContent = `${s.name} (${s.durationMinutes} min)`;
                select.appendChild(opt);
            });
            loadEmployees();
        } catch (e) {
            select.innerHTML = '<option value="">Erro ao carregar serviços</option>';
        }
    }

    async function loadEmployees() {
        const select = document.getElementById('employeeSelect');
        select.innerHTML = '<option value="">Carregando...</option>';
        try {
            const resp = await fetch(`${API_URL}/public/employees?companyId=${COMPANY_ID}`);
            if (!resp.ok) throw new Error();
            const data = await resp.json();
            employeeList = data;
            select.innerHTML = '';
            if (data.length === 0) {
                select.innerHTML = '<option value="">Nenhum profissional disponível</option>';
                return;
            }
            data.forEach(e => {
                const opt = document.createElement('option');
                opt.value = e.id;
                opt.textContent = e.name + (e.specialty ? ` (${e.specialty})` : '');
                select.appendChild(opt);
            });
            initCalendar();
        } catch (e) {
            select.innerHTML = '<option value="">Erro ao carregar profissionais</option>';
        }
    }

    function initCalendar() {
        const today = new Date();
        currentYear = today.getFullYear();
        currentMonth = today.getMonth();
        renderCalendar();
    }

    function changeMonth(delta) {
        currentMonth += delta;
        if (currentMonth < 0) { currentMonth = 11; currentYear--; }
        if (currentMonth > 11) { currentMonth = 0; currentYear++; }
        renderCalendar();
    }

    async function renderCalendar() {
        const monthNames = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
                            'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
        document.getElementById('monthLabel').textContent = `${monthNames[currentMonth]} ${currentYear}`;

        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';

        const firstDay = new Date(currentYear, currentMonth, 1).getDay();
        const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        const today = new Date();
        const todayLocalStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

        const dayNames = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
        dayNames.forEach(d => {
            const el = document.createElement('div');
            el.className = 'day-name';
            el.textContent = d;
            grid.appendChild(el);
        });

        for (let i = 0; i < firstDay; i++) {
            const el = document.createElement('div');
            el.className = 'day-cell empty';
            grid.appendChild(el);
        }

        const serviceId = document.getElementById('serviceSelect').value;
        const employeeId = document.getElementById('employeeSelect').value;

        for (let day = 1; day <= daysInMonth; day++) {
            const dateObj = new Date(currentYear, currentMonth, day);
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const dayStr = String(dateObj.getDate()).padStart(2, '0');
            const dateStr = `${year}-${month}-${dayStr}`;

            const hasSlots = await dayHasSlots(dateStr, serviceId, employeeId);

            const el = document.createElement('div');
            el.className = 'day-cell';
            el.dataset.date = dateStr;

            if (hasSlots) {
                el.classList.add('has-slots');
                el.style.cursor = 'pointer';
            } else {
                el.classList.add('disabled');
            }
            if (dateStr < todayLocalStr) {
                el.classList.add('disabled');
                el.style.cursor = 'not-allowed';
            }
            el.textContent = day;

            if (hasSlots && dateStr >= todayLocalStr) {
                el.onclick = function() {
                    selectDay(dateStr);
                };
            }

            if (dateStr === selectedDate) {
                el.classList.add('selected');
            }

            grid.appendChild(el);
        }
    }

    async function dayHasSlots(dateStr, serviceId, employeeId) {
        if (!serviceId || !employeeId) return false;
        try {
            const cacheKey = `${dateStr}_${serviceId}_${employeeId}`;
            if (daySlotsMap[cacheKey] !== undefined) {
                return daySlotsMap[cacheKey].length > 0;
            }
            const resp = await fetch(`${API_URL}/public/slots?companyId=${COMPANY_ID}&date=${dateStr}`);
            if (!resp.ok) return false;
            const slots = await resp.json();
            daySlotsMap[cacheKey] = slots;
            return slots.length > 0;
        } catch (e) {
            return false;
        }
    }

    async function selectDay(dateStr) {
        document.querySelectorAll('.day-cell').forEach(el => {
            el.classList.remove('selected');
        });
        const selectedElement = document.querySelector(`.day-cell[data-date="${dateStr}"]`);
        if (selectedElement) {
            selectedElement.classList.add('selected');
        }

        selectedSlot = null;
        document.getElementById('bookingForm').style.display = 'none';

        const serviceId = document.getElementById('serviceSelect').value;
        const employeeId = document.getElementById('employeeSelect').value;

        if (!serviceId || !employeeId) {
            showAlert('Selecione serviço e profissional primeiro.', 'error');
            return;
        }

        const container = document.getElementById('slotsContainer');
        const grid = document.getElementById('slotGrid');
        const msg = document.getElementById('slotMessage');
        const labelSpan = document.getElementById('selectedDayLabel');

        const now = new Date();

        const parts = dateStr.split('-');
        const year = parseInt(parts[0]);
        const month = parseInt(parts[1]) - 1;
        const day = parseInt(parts[2]);
        const dayNames = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
        const monthNames = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho',
                            'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
        const dateObj = new Date(year, month, day);
        const weekday = dateObj.getDay();
        const dayName = dayNames[weekday];
        const monthName = monthNames[month];
        const formattedDate = `${dayName}, ${day} de ${monthName} de ${year}`;
        labelSpan.textContent = `Horários disponíveis em ${formattedDate}`;

        grid.innerHTML = '<div class="loading">Carregando horários...</div>';
        container.style.display = 'block';

        try {
            const slotsResp = await fetch(`${API_URL}/public/slots?companyId=${COMPANY_ID}&date=${dateStr}`);
            if (!slotsResp.ok) throw new Error('Erro ao buscar horários');
            const allSlots = await slotsResp.json();

            const occupiedResp = await fetch(`${API_URL}/public/occupied-slots?companyId=${COMPANY_ID}&date=${dateStr}&employeeId=${employeeId}`);
            let occupied = [];
            if (occupiedResp.ok) {
                occupied = await occupiedResp.json();
            }

            grid.innerHTML = '';
            if (allSlots.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#6b7280;">Nenhum horário disponível neste dia</div>';
                msg.textContent = '';
                return;
            }

            selectedDate = dateStr;

            allSlots.forEach(slotTime => {
                const slotDateTime = new Date(`${dateStr}T${slotTime}:00`);
                const isPassed = slotDateTime <= now;
                const isOccupied = occupied.includes(slotTime) || isPassed;

                const div = document.createElement('div');
                div.className = 'slot' + (isOccupied ? ' occupied' : '');
                div.textContent = slotTime;
                div.dataset.time = slotTime;
                if (!isOccupied) {
                    div.onclick = function() {
                        document.querySelectorAll('.slot').forEach(el => el.classList.remove('selected'));
                        div.classList.add('selected');
                        selectedSlot = slotTime;
                        document.getElementById('bookingForm').style.display = 'block';
                    };
                }
                grid.appendChild(div);
            });

            const availableCount = allSlots.filter(slotTime => {
                const slotDateTime = new Date(`${dateStr}T${slotTime}:00`);
                return !occupied.includes(slotTime) && slotDateTime > now;
            }).length;

            msg.textContent = `${availableCount} horário(s) disponível(is)`;
            document.getElementById('bookingForm').style.display = 'none';

        } catch (e) {
            console.error(e);
            grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#ef4444;">Erro ao carregar horários</div>';
            msg.textContent = '';
        }
    }

    async function createBooking() {
        const serviceId = document.getElementById('serviceSelect').value;
        const employeeId = document.getElementById('employeeSelect').value;
        const clientName = document.getElementById('clientName').value.trim();
        const clientEmail = document.getElementById('clientEmail').value.trim();
        const clientPhone = document.getElementById('clientPhone').value.trim();
        const date = selectedDate;

        if (!serviceId || !employeeId || !clientName || !clientEmail || !selectedSlot || !date) {
            showAlert('Preencha todos os campos e selecione um horário.', 'error');
            return;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(clientEmail)) {
            showAlert('Por favor, insira um e-mail válido.', 'error');
            return;
        }

        // Verifica se o horário já passou
        const now = new Date();
        const slotDateTime = new Date(date + 'T' + selectedSlot);
        if (slotDateTime <= now) {
            showAlert('Este horário já passou. Selecione um horário futuro.', 'error');
            return;
        }

        // --- CORREÇÃO: enviar data/hora no formato local (sem fuso) ---
        const localDateTime = date + 'T' + selectedSlot + ':00';

        const body = {
            serviceId,
            employeeId,
            clientName,
            clientEmail,
            clientPhone,
            startTime: localDateTime
        };

        const btn = document.getElementById('bookBtn');
        btn.disabled = true;
        btn.textContent = 'Agendando...';

        try {
            const resp = await fetch(`${API_URL}/public/schedules?companyId=${COMPANY_ID}`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(body)
            });

            if (!resp.ok) {
                const errorText = await resp.text();
                throw new Error(errorText || 'Erro ao agendar');
            }

            showAlert('Agendamento realizado! Verifique seu e-mail para confirmar.', 'success');

            document.getElementById('clientName').value = '';
            document.getElementById('clientEmail').value = '';
            document.getElementById('clientPhone').value = '';
            document.querySelectorAll('.slot.selected').forEach(el => el.classList.remove('selected'));
            selectedSlot = null;
            document.getElementById('bookingForm').style.display = 'none';
            await selectDay(date);
            renderCalendar();
        } catch (e) {
            showAlert('Erro ao agendar: ' + e.message, 'error');
            console.error(e);
        } finally {
            btn.disabled = false;
            btn.textContent = 'Agendar';
        }
    }

    document.getElementById('serviceSelect').addEventListener('change', () => {
        daySlotsMap = {};
        selectedDate = null;
        document.getElementById('slotsContainer').style.display = 'none';
        document.getElementById('bookingForm').style.display = 'none';
        selectedSlot = null;
        renderCalendar();
    });
    document.getElementById('employeeSelect').addEventListener('change', () => {
        daySlotsMap = {};
        selectedDate = null;
        document.getElementById('slotsContainer').style.display = 'none';
        document.getElementById('bookingForm').style.display = 'none';
        selectedSlot = null;
        renderCalendar();
    });

    async function init() {
        if (!COMPANY_ID) {
            document.getElementById('companyName').textContent = 'Link inválido';
            showAlert('Link inválido. Verifique o endereço.', 'error');
            return;
        }
        await loadCompany();
        await loadServices();
    }

    init();
</script>
<script src="/js/theme.js"></script>
</body>
</html>
