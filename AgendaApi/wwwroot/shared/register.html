<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <style>
        body { font-family: Arial; max-width: 400px; margin: 40px auto; padding: 20px; }
        input, button { width: 100%; padding: 8px; margin-bottom: 10px; }
        button { background: #4CAF50; color: white; border: none; cursor: pointer; }
        button:hover { background: #45a049; }
    </style>
</head>
<body>
    <h2>Criar Conta da Empresa</h2>
    <input id="email" placeholder="Email" type="email">
    <input id="password" type="password" placeholder="Senha">
    <label><input type="checkbox" onclick="togglePassword()"> Mostrar senha</label>
    <button onclick="register()">Cadastrar</button>
    <p>Já tem conta? <a href="/shared/login.html">Entrar</a></p>
    <script src="/js/auth.js?v=4"></script>
</body>
</html>
