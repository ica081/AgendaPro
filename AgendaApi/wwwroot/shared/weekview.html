<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Agenda Semanal</title>
    <style>
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f2f2f2; }
        .hour-cell { width: 60px; background: #f9f9f9; font-weight: bold; }
        .appointment { 
            background: #4CAF50; 
            color: white; 
            padding: 4px 6px; 
            border-radius: 4px; 
            font-size: 12px; 
            display: inline-block;
            max-width: 100%;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <h2>Agenda Semanal</h2>

    <button onclick="loadWeek()">Carregar</button>
    <div id="week-container"></div>

    <button onclick="window.location.href='/company/dashboard-empresa.html'">Voltar</button>

    <script>
        // Removido: lógica de cliente e seletor de empresa
        // Agora só empresa, usa localStorage.getItem("companyId")
        // O weekview.js já faz isso, então nenhum código extra necessário.

        // 🔥 Apenas carrega a semana diretamente
        document.addEventListener('DOMContentLoaded', function() {
            const companyId = localStorage.getItem("companyId");
            if (!companyId) {
                alert("Você precisa criar uma empresa primeiro.");
                window.location.href = "/company/companies.html";
                return;
            }
            loadWeek();
        });
    </script>

    <!-- Carrega o weekview.js -->
    <script src="/js/weekview.js?v=4"></script>
</body>
</html>
